[package]
name = "micloop"
version = "0.1.0"
edition = "2021"
authors = ["rkitamu"]
description = "Hotkey-controlled microphone loopback for PulseAudio/PipeWire"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.12"
ksni = "0.2"
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
